name: Docker CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      IMAGE: ${{ secrets.DOCKER_USERNAME || 'local' }}/minha-app:v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
          -t $IMAGE .

      # Login e push só rodam quando os secrets DOCKER_USERNAME e DOCKER_TOKEN
      # estão configurados no repositório (Settings > Secrets and variables > Actions).
      - name: Login Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Push Docker Image
        if: env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != ''
        run: |
          docker push \
          $IMAGE
