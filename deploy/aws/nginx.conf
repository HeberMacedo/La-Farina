# Nginx do site na AWS: serve o site e repassa /api/... para o container da API.
# Assim o site usa o mesmo endereço da máquina e não depende do IP dela.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker: acha o container "api" mesmo se ele subir depois.
    resolver 127.0.0.11 valid=10s;

    location ^~ /api/ {
        set $api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
