# Logstash: lê o log JSON da API (uma linha por evento) e manda para o Elasticsearch.
# A API escreve em /app/logs/api.log (variável LOG_ARQUIVO); o volume api-logs
# aparece aqui como /logs.
input {
  file {
    path => "/logs/api.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-api"
    codec => json
  }
}

filter {
  # Usa a hora em que a API gerou o log, não a hora em que o Logstash leu.
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    remove_field => ["timestamp", "event", "log", "host", "@version"]
  }
}

output {
  # Um índice por dia: lafarina-logs-2026.12.02
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "lafarina-logs-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
