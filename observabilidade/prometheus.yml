# Prometheus: a cada 5 segundos busca as métricas em http://api:3000/metrics
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: la-farina-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
