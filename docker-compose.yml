services:
  api:
    build:
      context: .
      target: api
    command: ["node", "server/server.js"]
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    volumes:
      - db-data:/app/db
    restart: unless-stopped

  web:
    build:
      context: .
      target: production
      args:
        VUE_APP_API_BASE_URL: http://localhost:3000
        VUE_APP_PUBLIC_PATH: /
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
