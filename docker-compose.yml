services:
  api:
    build:
      context: .
      target: api
    command: ["node", "server/server.js"]
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # Liga o header X-Simulate-Error só para demonstração: SIMULAR_ERROS=true docker compose ...
      SIMULAR_ERROS: ${SIMULAR_ERROS:-false}
    volumes:
      - db-data:/app/db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      target: production
      args:
        VUE_APP_API_BASE_URL: http://localhost:3000
        VUE_APP_PUBLIC_PATH: /
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  # ---- Observabilidade (opcional): docker compose --profile observabilidade up -d ----
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observabilidade"]
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/alertas.yml:/etc/prometheus/alertas.yml:ro
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observabilidade"]
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/la-farina.json
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  db-data:
